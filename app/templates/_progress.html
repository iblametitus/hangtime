<div class="rounded-xl border border-slate-200 bg-white p-4"
     hx-get="/api/analyses/{{ job.id }}" hx-trigger="load delay:1500ms" hx-swap="outerHTML">
  <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Analysing</h2>
  <ol class="mt-3 space-y-2">
    {% for label, state in steps %}
    <li class="flex items-center gap-3 text-sm {% if state == 'pending' %}text-slate-400{% endif %}">
      {% if state == "done" %}
      <span class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-500 text-xs text-white">✓</span>
      {% elif state == "current" %}
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600"></span>
      {% else %}
      <span class="h-5 w-5 rounded-full border-2 border-slate-200"></span>
      {% endif %}
      <span class="{% if state == 'current' %}font-semibold{% endif %}">{{ label }}</span>
    </li>
    {% endfor %}
  </ol>
  <p class="mt-4 text-xs text-slate-500">Usually 15–30 seconds. NVIDIA Nemotron models on Nebius Token Factory.</p>
</div>
