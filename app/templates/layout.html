{% extends "base.html" %}
{% block body %}
<div class="mx-auto max-w-5xl">
  <header class="flex items-center justify-between border-b border-line px-5 py-4 sm:px-8">
    <a href="/" class="font-display text-2xl font-black uppercase tracking-tight">Hangtime</a>
    <nav class="flex items-center gap-5 text-sm">
      <a href="/about" class="border-b-2 pb-0.5 {% if nav == 'about' %}border-ember text-cream{% else %}border-transparent text-cream/80 hover:text-cream{% endif %}">About</a>
      <a href="/demo" class="border-b-2 pb-0.5 {% if nav == 'demo' %}border-ember text-cream{% else %}border-transparent text-cream/80 hover:text-cream{% endif %}">Demo</a>
      <a href="/demo" class="hidden border border-cream/70 px-4 py-2 hover:bg-cream hover:text-ink sm:inline">Check a drill</a>
    </nav>
  </header>

  <div class="relative">
    {# side bars, as in the reference: orange and blue segments along both edges #}
    <div aria-hidden="true" class="pointer-events-none absolute inset-y-4 left-1.5 flex w-1 flex-col gap-2 sm:left-3 sm:w-1.5">
      <span class="h-24 rounded-full bg-ember"></span><span class="h-16 rounded-full bg-ember/30"></span>
      <span class="flex-1 rounded-full bg-court"></span><span class="h-20 rounded-full bg-ember/30"></span>
      <span class="h-32 rounded-full bg-court"></span>
    </div>
    <div aria-hidden="true" class="pointer-events-none absolute inset-y-4 right-1.5 flex w-1 flex-col gap-2 sm:right-3 sm:w-1.5">
      <span class="h-40 rounded-full bg-court"></span><span class="h-48 rounded-full bg-ember/70"></span>
      <span class="flex-1 rounded-full bg-court"></span>
    </div>

    <main class="mx-4 min-h-[80vh] border-x border-line px-4 pb-10 pt-5 sm:mx-8 sm:px-8">
      {% block main %}{% endblock %}
    </main>
  </div>
</div>
{% block scripts %}{% endblock %}
{% endblock %}
